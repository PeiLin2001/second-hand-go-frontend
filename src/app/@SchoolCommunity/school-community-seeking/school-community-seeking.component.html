<h4>許願池 ! 歡迎向同學們提出你的需求~~</h4>

<ul>
  @for (item of wishList; track $index) {
    <li class="wishList-item">
      <p class="wish-title">{{item.title}}</p>
      <p class="wish-description">{{item.description}}</p>

      <div class="wisher-wrapper">
        <img [src]="item.wisher.userImgPath" alt="♥" class="wisher-profile">
        <p class="wisher-name">{{item.wisher.userName}} · {{item.wisher.school}}</p>

        <button class="btn-action primary" (click)="chat()">
          <lucide-icon name="MessageCircleMore"></lucide-icon>聊聊
        </button>
      </div>

    </li>
  }
</ul>
