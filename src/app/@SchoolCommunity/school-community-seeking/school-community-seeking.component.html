<section class="wish-page">
  @if (currentUserSchool === currentBoardSchool){
  <div class="wish-header">
    <div class="wish-title-group">
      <h4>許願池 ! </h4>
      <p>歡迎向同學們提出你的需求，讓大家一起幫你找到想要的商品。</p>
    </div>

    <button (click)="switchPanel()">
      <lucide-icon name="Plus"></lucide-icon>
      我要許願
    </button>
  </div>
  }
  @else {
  <div class="wish-header is-visitor">
    <div class="wish-title-group">
      <h4>這裡是 {{currentBoardSchool}} 的許願池 ! </h4>
      <p>非同校學生，會失去部分瀏覽權限 !</p>
    </div>
  </div>
  }

  <app-wish-card [wishList]="wishList"></app-wish-card>
</section>



@if (showPanel) {
<div class="panel-overlay" [class.active]="showPanel" (click)="closePanel()">

  <section class="wish-panel" (click)="$event.stopPropagation()">

    <div class="panel-header">
      <h5>許個願吧 !</h5>
      <button class="btn-close" (click)="closePanel()">
        <lucide-icon name="X"></lucide-icon>
      </button>
    </div>

    <div class="panel-body">
      <div class="form-group">
        <label>許願標題 <span class="required">*</span></label>
        <input type="text" [(ngModel)]="wishForm.title" placeholder="例：找一本線性代數課本" maxlength="50" />
      </div>

      <div class="form-group">
        <label>詳細說明<span class="required">*</span></label>
        <textarea [(ngModel)]="wishForm.description" placeholder="補充版本、狀況需求或其他細節…" rows="3"></textarea>
      </div>

      <div class="form-group">
        <label>偏好交易地點<span class="required">*</span></label>
        <div class="chip-group">
          @for (city of cities; track city.id) {
          <button class="chip" [class.selected]="isSelected(wishForm.location, city.name)"
            (click)="toggleSelection(wishForm.location, city.name)" type="button">{{ city.name }}</button>
          }
        </div>
      </div>

      <div class="form-group">
        <label>預算範圍（元）<span class="required">*</span></label>

        <div class="budget-row">
          <input type="number" [(ngModel)]="wishForm.budgetMin" placeholder="最低" min="0" [disabled]="isNegotiable" />
          <span class="budget-sep">—</span>
          <input type="number" [(ngModel)]="wishForm.budgetMax" placeholder="最高" min="0" [disabled]="isNegotiable" />
        </div>

        <label class="checkbox-item" style="margin-top: 0.5rem; display: flex; align-items: center; gap: 0.25rem;">
          <input type="checkbox" (change)="toggleNegotiable($event)">
          <span>預算面議 / 無上限</span>
        </label>
      </div>

      <div class="form-group">
        <label>瀏覽權限<span class="required">*</span></label>

        <label class="radio-label">
          <input type="radio" name="visibility" value="active" [(ngModel)]="wishForm.status" />
          <span>公開</span>
        </label>

        <label class="radio-label">
          <input type="radio" name="visibility" value="school-only" [(ngModel)]="wishForm.status" />
          <span>僅限校內</span>
        </label>
      </div>

      @if (submitError) {
      <p class="submit-error"> {{ submitError }}</p>
      }
    </div>

    <div class="panel-footer">
      <button class="btn-cancel" (click)="closePanel()" [disabled]="isSubmitting">取消</button>
      <button class="btn-submit" (click)="submitWish()" [disabled]="isSubmitting">
        {{ isSubmitting ? '送出中…' : '送出許願' }}
      </button>
    </div>

  </section>

</div>
}
