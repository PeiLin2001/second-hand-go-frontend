<main class="content">

  <nav class="filter-panel">

    <!-- 麵包屑 -->
    <nav class="breadcrumb" >
      <a routerLink="/home" class="breadcrumb-link">
        <lucide-icon name="Home" size="16"></lucide-icon>
          首頁
      </a>
      <span class="sep">></span>
      <span class="current">尋找賣家</span>
    </nav>

    <!-- 標題列 + 排序 -->
    <header class="list-header">
      <h1 class="category-name">尋找賣家</h1>

      <div class="sort-container">
        <button class="sort-button"
        (click)="togglePanel($event, 'sort')"
        [class.active]="panelState.sort">
          <span>排序依據</span>
          <span class="material-symbols-outlined">sort</span>
        </button>

        @if (panelState.sort) {
           <ul class="dropdown-content" (click)="$event.stopPropagation()">
            <li [class.selected]="sortOption === 'newest'"
                (click)="setSort('newest', $event)">最新加入</li>
            <li [class.selected]="sortOption === 'credit-score'"
                (click)="setSort('credit-score', $event)">信用評分</li>
            <li [class.selected]="sortOption === 'transaction-count'"
                (click)="setSort('transaction-count', $event)">交易筆數</li>
          </ul>
        }
      </div>
    </header>

    <!-- 篩選列：篩選按鈕 + 已選 tags 同一行 -->
    <div class="filter-row">

      <p>您所在的位置 |  </p>
      <p>緯度：{{ lat }}</p>
      <p>經度：{{ lng }}</p>
      <p>所在縣市：{{ cityName }}</p>

      <button class="fab-filter">
        只看附近賣家
      </button>


      <button class="fab-filter">
        只看優良賣家
      </button>

    </div>

  </nav>

  <div class="search-container">
    <input
      type="text"
      class="search"
      [(ngModel)]="searchText"
      (ngModelChange)="onSearchChange($event)"
      placeholder="尋找同學（可輸入姓名或科系）..."
    >
  </div>

  <!-- 增加一個防呆與友善提示：找不到人時顯示提示 -->
  @if (filteredUsers.length > 0) {
    <app-user-card [users]="filteredUsers"></app-user-card>
  } @else {
    <section class="empty-state">

      <div class="empty-icon-wrapper">
        <span class="material-symbols-outlined">search_off</span>
      </div>

      <div class="empty-content">
        <h2>找不到同學 !</h2>
        <p class="empty-description">
          我們找不到符合 <span>"{{ searchText }}"</span> 的同學，換個關鍵字試試看吧！
        </p>
      </div>

      <div class="empty-actions">
        <button
          class="text-btn secondary-link"
          (click)="clearAllFilters($event)"
        >
          清除搜尋
        </button>

        <span class="divider">|</span>

        <button
          class="text-btn primary-link"
          routerLink="/home"
        >
          返回首頁
        </button>
      </div>

    </section>

  }
</main>
