<main class="chat-container">
  <section class="chat-box">
    <div class="chat-left">
      <img src="img/logo改版.png" alt="logo" class="logo" title="首頁" (click)="goToHome()">
    </div>

    <div class="chat-right">
      <div #scrollContainer class="message-list">
        @for (msg of message; track msg.messageId) {
        <div class="message-wrapper" [class.is-me]="msg.senderId === userId">

          <img [src]="msg.senderImg" class="avatar" alt="user-avatar">

          <div class="message-body">
            <span class="name">{{ msg.senderName }}</span>
            <div class="bubble">{{ msg.messageContent }}</div>
            <span class="time">{{ msg.createdAt }}</span>
          </div>

        </div>
        } @empty {
        <div class="no-message">目前沒有任何聊天訊息喔。</div>
        }
      </div>

      <div class="input-group-box">
        <input type="text" [(ngModel)]="enter" (keyup.enter)="sendMsg()" class="enter-input" placeholder="請輸入訊息...">
        <button class="send-btn" (click)="sendMsg()">送出</button>
      </div>
    </div>
  </section>
</main>
