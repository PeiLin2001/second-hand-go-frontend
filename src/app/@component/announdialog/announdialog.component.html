<main class="dialog-box">

  <header class="dialog-header">
    <h2>{{ data.title }}</h2>

    <button type="button" class="close-btn" mat-dialog-close>
      ✕
    </button>
  </header>

  <section class="announcement-content">
    @if (data.imgPath) {
      <div class="dialog-image">
        <img [src]="data.imgPath" alt="公告圖片">
      </div>
    }

    <div class="dialog-body">
      <p>{{ data.content }}</p>
    </div>
  </section>

  <footer class="dialog-actions">
    <button type="button" class="confirm-btn" mat-dialog-close>
      確定
    </button>
  </footer>

</main>
