<ul>
  @for (item of wishList; track $index) {
    <li class="wishList-item">
      <div class="wish-info">

        <h4 class="wish-title">{{item.title}}</h4>

        <div class="description-wrapper">
          <h5 class="subtitle">需求描述</h5>
          <p class="wish-description">{{item.description}}</p>
        </div>

        <div class="budget">
          <h5 class="subtitle">預算</h5>
          <p class="contex">NT${{item.budgetMin}} - {{item.budgetMax}}</p>
        </div>

        <div class="budget">
          <h5 class="subtitle">可面交地點</h5>
          <p class="contex">{{item.location}}</p>
        </div>

      </div>


      <div class="wisher-wrapper">

        <div class="kebab-wrap">
          <button class="btn-kebab" (click)="toggleMenu($event, item)" title="更多操作">
            <lucide-icon name="MoreVertical" size="16"></lucide-icon>
          </button>

          <div class="kebab-dropdown" [style.display]="openMenuWishId === item.id ? 'block' : 'none'">
            <button class="kebab-item danger" (click)="goRepot(item)">
              <lucide-icon name="Flag" size="14"></lucide-icon>
              <span>檢舉</span>
            </button>
          </div>
        </div>

        <div class="wisher-core-info">
          <div class="img-wrapper">
            <img [src]="item.wisher.userImgPath" alt="♥" class="wisher-profile">
          </div>

          <div class="wisher-info">
            <h5 class="wisher-name">{{item.wisher.userName}}</h5>
            <p class="school">{{item.wisher.school}}</p>
          </div>

          <div class="credit-info">
            <p class="credit-score">
              {{item.wisher.goodLevel}} ★
            </p>
          </div>
        </div>

        <button class="btn-action primary" (click)="chat()">
          <lucide-icon name="MessageCircleMore"></lucide-icon>聊聊
        </button>

      </div>

    </li>
  }
</ul>
