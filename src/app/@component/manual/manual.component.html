<section class="manual-container">

  <!-- HERO -->
  <section class="manual-hero">

      <img src="img/logo改版.png">
    </div>

    <div class="hero-right">
      <h2>大學生專屬二手交易平台</h2>

        安全、單純、值得信任的校園交易空間。
      </p>

    </div>

  </section>

  <section class="manual-hero page-two">

    <div class="hero-right">

      <p class="context-p">

  <!-- PAGE THREE - 交易流程 -->
<section class="manual-flow">

  <h2>我們的<span>交易流程</span></h2>

  <div class="flow-steps">

    <div class="flow-step">
      <div class="icon-circle">
        <lucide-icon name="search" size="58"></lucide-icon>
        <span class="step-number">01</span>
      </div>

      <h3>尋找商品</h3>
      <p>透過商品列表尋找商品</p>
    </div>

    <div class="flow-step">
      <div class="icon-circle">
        <lucide-icon name="send" size="58"></lucide-icon>
        <span class="step-number">02</span>
      </div>

      <h3>發送請求</h3>
      <p>買家向賣家發送交易請求</p>
    </div>

    <div class="flow-step">
      <div class="icon-circle">
        <lucide-icon name="user-star" size="58"></lucide-icon>
        <span class="step-number">03</span>
      </div>

      <p>賣家經過評估，接受交易請求</p>
    </div>

    <div class="flow-step">
      <div class="icon-circle">
        <lucide-icon name="handshake" size="58"></lucide-icon>
        <span class="step-number">04</span>
      </div>

      <h3>進行交易</h3>
      <p>買賣雙方自行協議交易方式</p>
    </div>

    <div class="flow-step">
      <div class="icon-circle five-step">
        <lucide-icon name="check" size="58" class="five-icon"></lucide-icon>
        <span class="step-number">05</span>
      </div>

      <h3>交易完成</h3>
      <p>完成交易後，可互相進行評價</p>
    </div>

  </div>
